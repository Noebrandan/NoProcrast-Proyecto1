<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoProcras - Perfil</title>
    <link rel="stylesheet" href="/assets/css/perfil.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <span class="red">No</span>Procras
        </div>

        <nav>
            <a href="/index.html">Inicio</a>
            <a href="/pages/misiones.html">Misiones</a>
            <a href="#" class="active">Perfil</a>
        </nav>
    </header>

    <main class="container">

        <!-- PERFIL -->
        <section class="profile-card">

            <div class="profile-top">

                <div class="profile-info">
                    <div class="avatar">
                        <i class="fas fa-crossed-swords"></i>
                    </div>

                    <div>
                        <h2>Juan</h2>

                        <div class="badge">
                            👑 Nivel 2 · Explorador
                        </div>
                    </div>
                </div>

                <button class="btn-outline">
                    Editar nombre
                </button>

            </div>

            <div class="progress-section">
                <div class="progress-header">
                    <span>Progreso al nivel 3 · Guerrero</span>
                    <span>65 / 150 pts</span>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <button class="reset-btn">
                Reiniciar progreso
            </button>

        </section>

        <!-- EDITAR NOMBRE -->
        <section class="edit-card">

            <h3>Editar nombre</h3>

            <input type="text" value="Juan">

            <div class="buttons">
                <button class="btn-primary">
                    Guardar
                </button>

                <button class="btn-secondary">
                    Cancelar
                </button>
            </div>

        </section>

        <!-- ESTADÍSTICAS -->
        <section class="stats">

            <h3>ESTADÍSTICAS</h3>

            <div class="stats-grid">

                <div class="stat-box">
                    <div class="number yellow">65</div>
                    <p>puntos totales</p>
                </div>

                <div class="stat-box">
                    <div class="number green">4</div>
                    <p>completadas</p>
                </div>

                <div class="stat-box">
                    <div class="number red">3</div>
                    <p>pendientes</p>
                </div>

                <div class="stat-box">
                    <div class="number white">7</div>
                    <p>total creadas</p>
                </div>

            </div>

        </section>

        <!-- LOGROS -->
        <section class="achievements">

            <h3>LOGROS</h3>

            <div class="achievement-grid">

                <div class="achievement unlocked">
                    <div class="icon">🎯</div>
                    <span>Primera misión</span>
                </div>

                <div class="achievement unlocked">
                    <div class="icon">🔥</div>
                    <span>3 en un día</span>
                </div>

                <div class="achievement locked">
                    <div class="icon">📅</div>
                    <span>Semana perfecta</span>
                </div>

                <div class="achievement locked">
                    <div class="icon">👑</div>
                    <span>Nivel leyenda</span>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
